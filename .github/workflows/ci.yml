name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; every push to a protected branch keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    name: Mobile (Expo / Lint / TypeScript / Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
